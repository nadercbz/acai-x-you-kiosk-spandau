<!doctype html>
<html lang="de"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Açaí x You Kiosk Folierung</title>
<style>
:root{--bg:#0d0b07;--card:#17140e;--text:#f3ecff;--mute:#b9b0a0;--pink:#ff4fa3}
body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,-apple-system,Helvetica,Arial,sans-serif}
header{padding:28px 20px 8px;max-width:1400px;margin:auto}
h1{margin:0;font-size:28px;font-weight:800}h1 b{color:var(--pink)}
p{color:var(--mute);margin:6px 0 0;font-size:14px}
h2{max-width:1400px;margin:28px auto 10px;padding:0 20px;font-size:13px;letter-spacing:.2em;color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;max-width:1400px;margin:auto;padding:0 20px}
figure{margin:0;background:var(--card);border-radius:10px;overflow:hidden;cursor:zoom-in}
figure img{width:100%;display:block}
figcaption{padding:8px 12px;font-size:13px;color:var(--mute)}
#gross{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;cursor:zoom-out}
#gross img{max-width:96vw;max-height:94vh}
@media(max-width:480px){.grid{grid-template-columns:1fr;padding:0 16px}}
</style></head><body>
